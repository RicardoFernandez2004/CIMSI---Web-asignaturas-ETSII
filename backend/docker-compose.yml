version: '3.8'

services:
  # --------------------------------------------------------
  # 1. Base de Datos de Autenticación
  # --------------------------------------------------------
  auth-db:
    image: postgres:15-alpine
    container_name: auth_db_container
    restart: always
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Persistencia de datos en disco host
      - auth_data:/var/lib/postgresql/data
      # Script DDL de inicialización (solo se ejecuta la primera vez)
      - ./init-scripts/auth_db.sql:/docker-entrypoint-initdb.d/auth_db.sql:ro

  # --------------------------------------------------------
  # 2. Base de Datos Académica
  # --------------------------------------------------------
  academic-db:
    image: postgres:15-alpine
    container_name: academic_db_container
    restart: always
    environment:
      POSTGRES_DB: ${ACADEMIC_DB_NAME}
      POSTGRES_USER: ${ACADEMIC_DB_USER}
      POSTGRES_PASSWORD: ${ACADEMIC_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - academic_data:/var/lib/postgresql/data
      - ./init-scripts/academic_db.sql:/docker-entrypoint-initdb.d/academic_db.sql:ro

  # --------------------------------------------------------
  # 3. Base de Datos de Feedback
  # --------------------------------------------------------
  feedback-db:
    image: postgres:15-alpine
    container_name: feedback_db_container
    restart: always
    environment:
      POSTGRES_DB: ${FEEDBACK_DB_NAME}
      POSTGRES_USER: ${FEEDBACK_DB_USER}
      POSTGRES_PASSWORD: ${FEEDBACK_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - feedback_data:/var/lib/postgresql/data
      - ./init-scripts/feedback_db.sql:/docker-entrypoint-initdb.d/feedback_db.sql:ro

# --------------------------------------------------------
# Declaración de Volúmenes Persistentes (Gestión por Docker)
# --------------------------------------------------------
volumes:
  auth_data:
    driver: local
  academic_data:
    driver: local
  feedback_data:
    driver: local