# ==============================================================================
# Configuracion API Gateway y Balanceador Nginx - Proyecto CIMSI
# Ubicacion en repositorio: infra/nginx/nginx.conf
# Despliegue: MV 1 (IP: 192.168.120.54)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # --------------------------------------------------------------------------
    # UPSTREAM BALANCEADOR DE CARGA (Alta Disponibilidad / Feedback Service HA)
    # Balancea el trafico entre MV 2 (Backend Principal) y MV 4 (Nodo Replica)
    # --------------------------------------------------------------------------
    upstream feedback_backend {
        server 192.168.120.58:8003 max_fails=3 fail_timeout=10s;
        server 192.168.120.66:8003 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # ----------------------------------------------------------------------
        # 1. FRONTEND SPA REACT (Archivos Estaticos)
        # ----------------------------------------------------------------------
        location / {
            root /var/www/html;
            index index.html index.htm;
            try_files  / /index.html;
        }

        # ----------------------------------------------------------------------
        # 2. MICROSERVICIO AUTH (MV 2 - IP 192.168.120.58:8001)
        # ----------------------------------------------------------------------
        location /api/auth/ {
            proxy_pass http://192.168.120.58:8001/;
            proxy_set_header Host ;
            proxy_set_header X-Real-IP ;
            proxy_set_header X-Forwarded-For ;
            proxy_set_header X-Forwarded-Proto ;
        }

        # ----------------------------------------------------------------------
        # 3. MICROSERVICIO ACADEMIC (MV 2 - IP 192.168.120.58:8002)
        # ----------------------------------------------------------------------
        location /api/academic/ {
            proxy_pass http://192.168.120.58:8002/;
            proxy_set_header Host ;
            proxy_set_header X-Real-IP ;
            proxy_set_header X-Forwarded-For ;
            proxy_set_header X-Forwarded-Proto ;
        }

        # ----------------------------------------------------------------------
        # 4. MICROSERVICIO FEEDBACK BALANCEADO (MV 2 + MV 4 - IP 192.168.120.58 / 192.168.120.66:8003)
        # ----------------------------------------------------------------------
        location /api/feedback/ {
            proxy_pass http://feedback_backend/;
            proxy_set_header Host ;
            proxy_set_header X-Real-IP ;
            proxy_set_header X-Forwarded-For ;
            proxy_set_header X-Forwarded-Proto ;

            # Conmutacion automatica ante caidas de nodo (Tolerancia a fallos M11)
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }
}
