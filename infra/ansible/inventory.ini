# ==============================================================================
# Inventario de Ansible - Proyecto CIMSI (infra/ansible/inventory.ini)
# Responsable: Persona 5 (Pareja 3 - Automatización y Escalado)
# ==============================================================================

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3

# MV 1: Gateway Nginx & Frontend SPA React
[gateway]
mv1_gateway ansible_host=192.168.120.54

# MV 2: Capa de Backend (Auth, Academic, Feedback FastAPI)
[backend]
mv2_backend ansible_host=192.168.120.58

# MV 3: Capa de Persistencia (PostgreSQL Auth, Academic, Feedback)
[persistencia]
mv3_db ansible_host=192.168.120.62

# MV 4: Nodo Réplica Feedback (HA) & Agente Monitorización
[replica]
mv4_replica ansible_host=192.168.120.66

# Grupos agrupados por función
[cluster_nodes:children]
gateway
backend
persistencia
replica
